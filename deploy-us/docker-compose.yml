# 美服 OpenIM —— 全 Docker · build/run 分离（save/load 形态）
# ────────────────────────────────────────────────────────────────────
# openim-server / openim-chat 用【预置镜像】（build 机 build+save，生产机 docker load），生产机不拉代码、不编译、不装 Go。
#   build 机（有源码）：bash build-and-save.sh   → 产出 openim-images-us.tar.gz + 打包 config 到 openim-config/ chat-config/
#   生产机（美服）：    docker load < ...tar.gz → bash patch-config.sh → docker compose up -d（= bash deploy.sh 一把梭）
# basics(mongo/redis/kafka/etcd) 仍由生产机 pull（公共镜像，amd64）；config 走部署包内 ./openim-config、./chat-config volume 挂载。
#
# ★ 8G 机内存硬顶（mem_limit）：mongo 1.5g(cache 0.4) + redis 1g + kafka 1g(heap 448m) + etcd 320m
#   + openim-server 1.5g + openim-chat 640m ≈ 6.1g，留 ~2g；轻载实际远低于硬顶。数据/在线涨了扩 16G 再把 mem_limit 调回。
# ★ 自愈：镜像入口 `mage start && tail`，PID1=tail、单进程崩容器不退，故挂 healthcheck+autoheal（整容器重启）。
#   healthcheck = 端口探活 + 进程计数（server 12 / chat 6，须与各自 start-config.yml 的服务数一致），
#   任一 rpc 被 OOM 杀/单崩 → 计数不足 → unhealthy → autoheal 整容器重启，堵住"端口在、消息链路死"的盲区。
networks:
  openim:
    driver: bridge

services:
  mongodb:
    image: "${MONGO_IMAGE}"
    mem_limit: 1536m
    ports:
      - "127.0.0.1:37017:27017"
    container_name: mongo
    command: >
      bash -c '
      docker-entrypoint.sh mongod --wiredTigerCacheSizeGB $$wiredTigerCacheSizeGB --auth &
      until mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval "db.runCommand({ ping: 1 })" &>/dev/null; do
        echo "Waiting for MongoDB to start..."
        sleep 1
      done &&
      mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval "
      db = db.getSiblingDB(\"$$MONGO_INITDB_DATABASE\");
      if (!db.getUser(\"$$MONGO_OPENIM_USERNAME\")) {
        db.createUser({
          user: \"$$MONGO_OPENIM_USERNAME\",
          pwd: \"$$MONGO_OPENIM_PASSWORD\",
          roles: [{role: \"readWrite\", db: \"$$MONGO_INITDB_DATABASE\"}]
        });
      }
      " &&
      tail -f /dev/null
      '
    volumes:
      - "${DATA_DIR}/components/mongodb/data/db:/data/db"
      - "${DATA_DIR}/components/mongodb/data/logs:/data/logs"
      - "${MONGO_BACKUP_DIR}:/data/backup"
    environment:
      - TZ=${TZ}
      - wiredTigerCacheSizeGB=0.4
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=openim_v3
      - MONGO_OPENIM_USERNAME=openIM
      - MONGO_OPENIM_PASSWORD=${MONGO_OPENIM_PASSWORD}
    restart: always
    networks:
      - openim

  redis:
    image: "${REDIS_IMAGE}"
    mem_limit: 1g
    container_name: redis
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - "${DATA_DIR}/components/redis/data:/data"
    environment:
      TZ: ${TZ}
    restart: always
    sysctls:
      net.core.somaxconn: 1024
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --aof-use-rdb-preamble yes
      --save ""
    networks:
      - openim

  etcd:
    image: "${ETCD_IMAGE}"
    mem_limit: 320m
    container_name: etcd
    ports:
      - "127.0.0.1:12379:2379"
      - "127.0.0.1:12380:2380"
    volumes:
      - "${DATA_DIR}/components/etcd:/etcd-data"
    environment:
      - ETCD_NAME=s1
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_CLUSTER=s1=http://0.0.0.0:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=tkn
      - ETCD_INITIAL_CLUSTER_STATE=new
      - TZ=${TZ}
    restart: always
    networks:
      - openim

  kafka:
    image: "${KAFKA_IMAGE}"
    mem_limit: 1g
    container_name: kafka
    user: root
    restart: always
    ports:
      - "127.0.0.1:19094:9094"
    volumes:
      - "${DATA_DIR}/components/kafka:/bitnami/kafka"
    environment:
      TZ: ${TZ}
      KAFKA_HEAP_OPTS: "-Xmx448m -Xms448m"
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_NUM_PARTITIONS: 8
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:19094"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INTERNAL"
    command: >
      /bin/sh -c 'exec /opt/bitnami/scripts/kafka/entrypoint.sh /opt/bitnami/scripts/kafka/run.sh'
    networks:
      - openim

  # ── OpenIM server（预置镜像，build 机 build+save，生产机 load；不在生产机 build）──
  openim-server:
    image: "openim-server:${IMAGE_TAG:-us}"
    container_name: openim-server
    mem_limit: 1536m
    restart: always
    depends_on:
      - mongodb
      - redis
      - kafka
      - etcd
    ports:
      - "127.0.0.1:10001:10001"   # msggateway WebSocket（Caddy /msg_gateway 反代到此）
      - "127.0.0.1:10002:10002"   # api（Caddy /api 反代到此）
    volumes:
      # 部署包内的 config（build-and-save.sh 打包、patch-config.sh 改地址/密码）；改配置免重新 build
      - "./openim-config:/openim-server/config"
    environment:
      - TZ=${TZ}
    healthcheck:
      # 端口探活（bash /dev/tcp，不受 HTTP 404 干扰）+ 进程计数（12 = start-config.yml 服务数；
      # pgrep 模式写 [o]penim- 防止匹配到 healthcheck 自身的 sh 命令行）
      test: ["CMD-SHELL", "bash -c ': < /dev/tcp/127.0.0.1/10002' && bash -c ': < /dev/tcp/127.0.0.1/10001' && [ $$(pgrep -f '[o]penim-' | wc -l) -ge 12 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s          # 给 mage start 拉起 12 个进程的时间
    labels:
      - autoheal=true
    networks:
      - openim

  # ── OpenIM_Chat（预置镜像；chat-api 10008 / admin-api 10009）──
  openim-chat:
    image: "openim-chat:${IMAGE_TAG:-us}"
    container_name: openim-chat
    mem_limit: 640m
    restart: always
    depends_on:
      openim-server:
        condition: service_healthy   # 等 server 起来（Chat 调 openim-server:10002）
    ports:
      - "127.0.0.1:10008:10008"   # chat-api（Caddy /chat 反代到此）
      - "127.0.0.1:10009:10009"   # admin-api（Caddy /complete_admin，可选）
    volumes:
      - "./chat-config:/openim-chat/config"
    environment:
      - TZ=${TZ}
    healthcheck:
      # 端口探活 + 进程计数（6 = chat start-config.yml 服务数：chat/admin/bot 各 api+rpc；
      # chat 进程 cmdline 无 openim- 前缀，用二进制路径 _output 匹配，[_] 防自匹配）
      test: ["CMD-SHELL", "bash -c ': < /dev/tcp/127.0.0.1/10008' && [ $$(pgrep -f '[_]output' | wc -l) -ge 6 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    labels:
      - autoheal=true
    networks:
      - openim

  # ── autoheal：监控 label=autoheal 且 healthcheck unhealthy 的容器，自动 docker restart ──
  autoheal:
    image: "${AUTOHEAL_IMAGE:-willfarrell/autoheal:latest}"
    container_name: autoheal
    restart: always
    environment:
      - TZ=${TZ}
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - openim
